services:
  postgres:
    image: postgres:17
    container_name: orderly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderly
      POSTGRES_PASSWORD: orderly
      POSTGRES_DB: orderly
    ports:
      - "5434:5432"
    volumes:
      - orderly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderly -d orderly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orderly-postgres-data:
