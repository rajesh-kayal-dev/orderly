name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Build Monorepo (Generate Prisma & Packages)
        run: pnpm run build

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit & Service Tests
        run: pnpm --filter @orderly/contracts --filter @orderly/events --filter @orderly/identity --filter @orderly/restaurant --filter @orderly/order --filter @orderly/payment --filter @orderly/delivery --filter @orderly/notification test
